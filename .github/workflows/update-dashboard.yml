name: Update Market Terminal (06:00 & 19:00 MSK)

on:
  schedule:
    # 06:00 МСК (03:00 UTC) каждый день
    - cron: '0 3 * * *'
    # 19:00 МСК (16:00 UTC) каждый день
    - cron: '0 16 * * *'
  workflow_dispatch: # Кнопка ручного запуска в любое время

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pandas numpy beautifulsoup4 lxml

      - name: Run data collectors and build dashboard
        run: |
          for script in scripts/*.py; do
            if [ "$script" != "scripts/build_dashboard.py" ]; then
              echo "Running $script..."
              python "$script" || echo "Warning: $script exited with non-zero status"
            fi
          done
          python scripts/build_dashboard.py
          cp -f dashboard.html index.html

      - name: Commit and push updated terminal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update terminal data [skip ci]" && git push)
